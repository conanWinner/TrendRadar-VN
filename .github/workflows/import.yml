name: Import TrendRadar history

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Copy master branch with full history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --bare https://github.com/conanWinner/TrendRadar.git source.git
          git -C source.git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/master:refs/heads/master

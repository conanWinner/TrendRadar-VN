name: Import TrendRadar snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Copy current project into standalone master branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/conanWinner/TrendRadar.git source
          mkdir snapshot
          git -C source archive HEAD | tar -x -C snapshot
          slack_prefix='https://hooks.slack.com/services'
          sed -i "s#${slack_prefix}/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX#${slack_prefix}/YOUR_TEAM_ID/YOUR_CHANNEL_ID/YOUR_TOKEN#g" snapshot/README-EN.md
          cd snapshot
          git init -b master
          git config user.name "conanWinner"
          git config user.email "doanquangthangqt04@gmail.com"
          git add . ':!.github/workflows/**'
          git commit -m "feat: import TrendRadar Vietnamese workspace"
          git remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push destination master
